[pytest]
testpaths = tests
addopts = -v --tb=short
asyncio_mode = strict
# Pre-existing gap (found 2026-08-25): `api/` isn't declared as an
# installable package (see pyproject.toml's packages.find), so
# `import api...` failed for every test in the suite, not just new
# ones — pytest's rootdir was never on sys.path. This puts it there.
pythonpath = .

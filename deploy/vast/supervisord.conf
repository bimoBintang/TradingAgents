[program:ollama]
; Local LLM server (GPU). Loopback only. Settings from deploy/ollama/ollama.env (overridable by env).
command=bash -c 'set -a; . /app/deploy/ollama/ollama.env; set +a; exec ollama serve'
priority=5
startsecs=5
autorestart=true
stopasgroup=true
environment=OLLAMA_HOST="127.0.0.1:11434"

[program:ollama_models]
; One-shot: pulls the models (first boot, into the persistent volume), warms them, checks they are on the GPU.
command=/app/deploy/ollama/setup_models.sh
priority=6
startsecs=0
autorestart=false
exitcodes=0,2

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24
priority=10
autorestart=true

[program:mt5terminal]
; Started by entrypoint.sh once the terminal is installed and common.ini is rendered.
command=wine "C:\Program Files\MetaTrader 5\terminal64.exe" /config:C:\mt5\common.ini
autostart=%(ENV_MT5_AUTOSTART)s
priority=20
startsecs=20
autorestart=true
stopasgroup=true

[program:mt5bridge]
; mt5linux RPyC server. Bound to loopback on purpose: it has no authentication.
; shortcut: CLI flags follow the mt5linux README as remembered; check `python3 -m mt5linux --help`.
command=python3 -m mt5linux --host 127.0.0.1 -p 18812 "wine python"
autostart=%(ENV_MT5_AUTOSTART)s
priority=30
startsecs=10
autorestart=true

[program:backend]
; Loopback on purpose: the API has NO authentication. Reach it through an SSH tunnel.
command=uvicorn api.main:app --host 127.0.0.1 --port 8000
directory=/app/TradingAgents
priority=40
startsecs=5
autorestart=true

[program:mcpo]
; MCP -> REST/OpenAPI proxy (for Open WebUI + Ollama and any non-MCP client). Tested command.
; --host 127.0.0.1 is REQUIRED: mcpo defaults to 0.0.0.0 and our API/MCP have no authentication.
; Pins (needed as of mcpo 0.0.20): mcp<2 (mcpo imports a client name removed in mcp 2.x) and
; fastapi<0.125 (newer FastAPI rejects an argument mcpo passes). Runs in its own Python 3.11 env.
command=uvx --python 3.11 --with "mcp<2" --with "fastapi<0.125" mcpo --host 127.0.0.1 --port 8100 --server-type streamable-http -- http://127.0.0.1:8765/mcp
directory=/app/TradingAgents
priority=55
startsecs=10
autorestart=true

[program:mcp]
; MCP server over streamable-http so any MCP client (incl. local-model agents) can control the AI.
; NO authentication: loopback only. Reach it through an SSH tunnel; never expose the port.
command=env MCP_TRANSPORT=streamable-http MCP_HTTP_HOST=127.0.0.1 MCP_HTTP_PORT=8765 python3 -m mcp_server.server
directory=/app/TradingAgents
priority=50
startsecs=5
autorestart=true
